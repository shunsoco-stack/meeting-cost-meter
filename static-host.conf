# Include these locations in a server block whose root points to out/.
location ~ ^/([^/]+)/(__next\.[^/]+)\.__PAGE__\.txt$ {
    try_files /$1/$2/__PAGE__.txt =404;
}

location ~ ^/result/[^/]+/?$ {
    try_files /result/view.html =404;
}

location / {
    try_files $uri $uri.html $uri/ =404;
}

error_page 404 /404.html;
